<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>Zupa pomidorowa</title>
</head>
<body>
  <div itemscope itemtype="https://schema.org/Recipe">
    <h1 itemprop="name">Zupa pomidorowa</h1>
    <img itemprop="image" src="https://example.test/img/zupa.jpg" alt="">
    <meta itemprop="prepTime" content="PT10M">
    <meta itemprop="cookTime" content="PT40M">
    <span itemprop="recipeYield">6 porcji</span>
    <ul>
      <li itemprop="recipeIngredient">1 l bulionu</li>
      <li itemprop="recipeIngredient">500 g przecieru pomidorowego</li>
      <li itemprop="recipeIngredient">100 g ryżu</li>
    </ul>
    <div itemprop="recipeInstructions" itemscope itemtype="https://schema.org/HowToStep">
      <span itemprop="text">Zagotuj bulion.</span>
    </div>
    <div itemprop="recipeInstructions" itemscope itemtype="https://schema.org/HowToStep">
      <span itemprop="text">Dodaj przecier i ryż, gotuj 20 minut.</span>
    </div>
  </div>
</body>
</html>
